name: Update YouTube Preview

on:
  schedule:
    # GitHub cron uses UTC. This is Sunday 7:15 PM NZST / 8:15 PM NZDT.
    - cron: "15 7 * * 0"
  workflow_dispatch:

jobs:
  update-youtube-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YouTube fetcher
        run: python -m pip install --upgrade yt-dlp

      - name: Update Supabase homepage preview
        env:
          SUPABASE_URL: https://odthwmpyhaqagdphcooi.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          YOUTUBE_STREAMS_URL: https://www.youtube.com/@生命之光灵粮堂教会/streams
        run: python scripts/update_youtube_preview.py
