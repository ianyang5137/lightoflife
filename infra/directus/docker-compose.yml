services:
  postgres:
    image: postgres:16-alpine
    container_name: lightoflife-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 8

  directus:
    image: directus/directus:11
    container_name: lightoflife-directus
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KEY: ${DIRECTUS_KEY}
      SECRET: ${DIRECTUS_SECRET}
      PUBLIC_URL: ${PUBLIC_URL}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      DB_CLIENT: pg
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      CORS_ENABLED: "true"
      CORS_ORIGIN: ${CORS_ORIGIN}
      WEBSOCKETS_ENABLED: "true"
      STORAGE_LOCATIONS: local
      STORAGE_LOCAL_DRIVER: local
      STORAGE_LOCAL_ROOT: /directus/uploads
      TZ: ${TZ}
    volumes:
      - directus_uploads:/directus/uploads

  nginx:
    image: nginx:1.27-alpine
    container_name: lightoflife-nginx
    restart: unless-stopped
    depends_on:
      - directus
    ports:
      - "127.0.0.1:${LOCAL_NGINX_PORT}:80"
    volumes:
      - ./nginx/lightoflife-directus.conf:/etc/nginx/conf.d/default.conf:ro

  backup:
    image: postgres:16-alpine
    container_name: lightoflife-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS}
      TZ: ${TZ}
    volumes:
      - ./backups:/backups
      - directus_uploads:/directus_uploads:ro
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "echo '0 2 * * * /usr/local/bin/backup.sh >> /backups/backup.log 2>&1' > /etc/crontabs/root
      && crond -f -l 8"

volumes:
  postgres_data:
  directus_uploads:
