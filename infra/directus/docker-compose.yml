services:
  postgres:
    image: postgres:16-alpine
    container_name: lightoflife-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 8

  directus:
    image: directus/directus:11
    container_name: lightoflife-directus
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KEY: ${DIRECTUS_KEY}
      SECRET: ${DIRECTUS_SECRET}
      PUBLIC_URL: ${PUBLIC_URL}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      DB_CLIENT: pg
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      CORS_ENABLED: "true"
      CORS_ORIGIN: ${CORS_ORIGIN}
      WEBSOCKETS_ENABLED: "true"
      STORAGE_LOCATIONS: local
      STORAGE_LOCAL_DRIVER: local
      STORAGE_LOCAL_ROOT: /directus/uploads
      TZ: ${TZ}
    volumes:
      - directus_uploads:/directus/uploads

  nginx:
    image: nginx:1.27-alpine
    container_name: lightoflife-nginx
    restart: unless-stopped
    depends_on:
      - directus
    ports:
      - "127.0.0.1:${LOCAL_NGINX_PORT}:80"
    volumes:
      - ./nginx/lightoflife-directus.conf:/etc/nginx/conf.d/default.conf:ro

  backup:
    image: postgres:16-alpine
    container_name: lightoflife-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS}
      TZ: ${TZ}
    volumes:
      - ./backups:/backups
      - directus_uploads:/directus_uploads:ro
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "echo '0 2 * * * /usr/local/bin/backup.sh >> /backups/backup.log 2>&1' > /etc/crontabs/root
      && crond -f -l 8"

  youtube_sync:
    image: node:22-alpine
    container_name: lightoflife-youtube-sync
    restart: unless-stopped
    depends_on:
      - directus
    working_dir: /app
    environment:
      TZ: ${TZ}
      DIRECTUS_URL: http://directus:8055
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      YOUTUBE_CHANNEL_ID: ${YOUTUBE_CHANNEL_ID}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY}
    volumes:
      - ./scripts:/app/scripts:ro
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "echo '15 19 * * 0 cd /app && node scripts/sync-youtube-latest.mjs >> /proc/1/fd/1 2>&1' > /etc/crontabs/root
      && node scripts/sync-youtube-latest.mjs || true
      && crond -f -l 8"

  weekly_importer:
    build: ./weekly-importer
    container_name: lightoflife-weekly-importer
    restart: unless-stopped
    depends_on:
      - directus
    environment:
      TZ: ${TZ}
      DIRECTUS_URL: http://directus:8055
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      WEEKLY_IMPORT_INTERVAL_SECONDS: ${WEEKLY_IMPORT_INTERVAL_SECONDS:-60}
    volumes:
      - weekly_importer_tmp:/tmp/weekly-importer

volumes:
  postgres_data:
  directus_uploads:
  weekly_importer_tmp:
