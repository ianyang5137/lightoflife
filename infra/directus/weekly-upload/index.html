<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>周報上傳｜生命之光靈糧堂後台</title>
    <style>
      :root {
        color-scheme: light dark;
        --green: #0f4d3f;
        --green-dark: #093329;
        --gold: #b9822b;
        --paper: #f7f4ed;
        --card: #ffffff;
        --text: #1f2d28;
        --muted: #65746f;
        --border: #dce5df;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #0d1512;
          --card: #141f1b;
          --text: #edf4ef;
          --muted: #a9b8b2;
          --border: #2a3b35;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 28px;
        background:
          linear-gradient(120deg, rgba(15, 77, 63, 0.14), transparent 45%),
          var(--paper);
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(560px, 100%);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 8px;
        box-shadow: 0 24px 80px rgba(5, 28, 22, 0.14);
        padding: 28px;
      }

      .eyebrow {
        margin: 0 0 8px;
        color: var(--gold);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 30px;
        line-height: 1.15;
      }

      p {
        margin: 0 0 22px;
        color: var(--muted);
        line-height: 1.65;
      }

      label {
        display: block;
        margin: 16px 0 8px;
        font-weight: 700;
      }

      input {
        width: 100%;
        min-height: 48px;
        padding: 11px 12px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: transparent;
        color: var(--text);
        font: inherit;
      }

      input[type="file"] {
        padding: 10px;
      }

      button {
        width: 100%;
        min-height: 48px;
        margin-top: 22px;
        border: 0;
        border-radius: 6px;
        background: var(--green);
        color: #ffffff;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.65;
      }

      .status {
        min-height: 48px;
        margin-top: 18px;
        padding: 12px 14px;
        border: 1px dashed var(--border);
        border-radius: 6px;
        color: var(--muted);
        line-height: 1.55;
      }

      .links {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        margin-top: 20px;
      }

      a {
        color: var(--green);
        font-weight: 800;
      }

      @media (prefers-color-scheme: dark) {
        a {
          color: #8fd2bf;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Weekly Bulletin</p>
      <h1>周報上傳</h1>
      <p>選擇本週 PDF 後送出，系統會自動建立「周報導入」記錄並開始解析。解析完成後，回到 Directus 審核摘要，再改成「請求發布」。</p>

      <form id="form">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="username" value="oyzpeng@gmail.com" required />

        <label for="password">密碼</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />

        <label for="file">周報 PDF</label>
        <input id="file" name="file" type="file" accept="application/pdf,.pdf" required />

        <button id="submit" type="submit">上傳並建立導入記錄</button>
      </form>

      <div id="status" class="status">尚未上傳。</div>
      <div class="links">
        <a href="/admin/content/weekly_bulletins">回到周報導入</a>
        <a href="/admin/">Directus 後台</a>
      </div>
    </main>

    <script>
      const form = document.querySelector("#form");
      const statusBox = document.querySelector("#status");
      const submitButton = document.querySelector("#submit");

      function setStatus(message) {
        statusBox.textContent = message;
      }

      function inferMeta(fileName) {
        const match = fileName.match(/(\d{4})年(\d{1,2})月(\d{1,2})日\\s*(\\d+)期/);
        if (!match) return { title: fileName.replace(/\\.pdf$/i, "") };
        const [, year, month, day, issue] = match;
        return {
          title: `周報${year}年${month}月${day}日 ${issue}期`,
          bulletin_date: `${year}-${month.padStart(2, "0")}-${day.padStart(2, "0")}`,
          issue_number: Number(issue)
        };
      }

      async function readJson(response, label) {
        const text = await response.text();
        let body;
        try {
          body = text ? JSON.parse(text) : {};
        } catch {
          throw new Error(`${label} 失敗：伺服器沒有回傳 JSON。`);
        }
        if (!response.ok) {
          const message = body?.errors?.[0]?.message || body?.message || response.statusText;
          throw new Error(`${label} 失敗：${message}`);
        }
        return body;
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const file = document.querySelector("#file").files[0];
        if (!file) return;

        submitButton.disabled = true;
        setStatus("登入中...");

        try {
          const login = await readJson(await fetch("/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              email: form.email.value,
              password: form.password.value
            })
          }), "登入");

          const token = login.data.access_token;
          setStatus("正在上傳 PDF...");

          const uploadForm = new FormData();
          uploadForm.append("title", file.name.replace(/\\.pdf$/i, ""));
          uploadForm.append("file", file, file.name);
          const uploaded = await readJson(await fetch("/files", {
            method: "POST",
            headers: { Authorization: `Bearer ${token}` },
            body: uploadForm
          }), "上傳 PDF");

          setStatus("正在建立周報導入記錄...");
          const meta = inferMeta(file.name);
          const created = await readJson(await fetch("/items/weekly_bulletins", {
            method: "POST",
            headers: {
              Authorization: `Bearer ${token}`,
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              ...meta,
              pdf_file: uploaded.data.id,
              process_status: "uploaded"
            })
          }), "建立導入記錄");

          setStatus(`完成。已建立周報導入記錄 #${created.data.id}，請等待約 1 分鐘後回 Directus 查看解析摘要。`);
        } catch (error) {
          setStatus(error.message || "上傳失敗，請稍後再試。");
        } finally {
          submitButton.disabled = false;
        }
      });
    </script>
  </body>
</html>
